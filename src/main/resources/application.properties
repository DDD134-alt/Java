spring.application.name=mini-prj

# 스프링 부트 웹 서버가 실행될 때 사용할 포트 번호를 8111번으로 지정
server.port=8111

# localhost:3306 : 내 컴퓨터(로컬)의 3306 포트에서 실행 중인 MySQL에 접속
# mini_ai_pr j: 연결할 데이터베이스(스키마) 이름
# ?useUnicode=true&characterEncoding=UTF-8 : 데이터 주고받을 때 한글이 깨지지 않도록 UTF-8 인코딩을 강제
# &serverTimezone=Asia/Seoul : 데이터베이스의 시간대를 한국(서울) 기준으로 설정하여 시간 오차를 방지
spring.datasource.url=jdbc:mysql://localhost:3306/mini_ai_prj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
# MySQL 계정과 비밀번호, 로그인할 때 사용
spring.datasource.username=root
spring.datasource.password=1234

# show_sql=true : 자바 코드로 작성된 JPA 동작이 실제 데이터베이스에 어떤 SQL 쿼리문으로 변환되는지 콘솔 창으로 보여주기
spring.jpa.properties.hibernate.show_sql=true
# format_sql=true : 들여쓰기와 줄바꿈을 적용해 보기 좋게(포맷팅) 출력
spring.jpa.properties.hibernate.format_sql=true
# ddl-auto=create: 애플리케이션이 실행될 때 자동으로 데이터베이스 테이블을 DROP 후 CREATE
# 서버를 껐다 켤 때마다 기존 테이블이 초기화되므로 개발 중에 주로 사용됨
spring.jpa.hibernate.ddl-auto=create
# 스프링 부트 2.6 버전 이상부터 API 경로 매칭 기본 전략이 바뀌면서,
# 스웨거(Swagger) 같은 문서 도구와 충돌이 나거나 오류가 발생하는 것을 방지하기 위해
# 예전 방식(ant_path_matcher)으로 되돌려 주는 설정
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.jpa.open-in-view=false